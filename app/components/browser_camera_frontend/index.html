<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    * { box-sizing: border-box; }
    html, body { width: 100%; margin: 0; background: #101512; color: #f7faf7; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .camera-shell { width: 100%; position: relative; overflow: hidden; background: #101512; }
    video { display: block; width: 100%; height: auto; aspect-ratio: 16 / 9; object-fit: contain; background: #101512; transform: scaleX(-1); }
    .stopped-frame { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; background: #101512; }
    .divider { position: absolute; top: 0; bottom: 0; left: 50%; width: 3px; transform: translateX(-50%); background: #55c58a; pointer-events: none; }
    .label { position: absolute; top: 14px; padding: 7px 11px; border-radius: 5px; background: rgba(16, 21, 18, .82); color: #fff; font-size: 14px; font-weight: 700; letter-spacing: .04em; pointer-events: none; }
    .left { left: 14px; } .right { right: 14px; }
    .controls { position: absolute; left: 50%; bottom: 14px; transform: translateX(-50%); display: flex; gap: 10px; align-items: center; }
    button { border: 0; border-radius: 6px; padding: 10px 16px; background: #246448; color: white; font-size: 15px; font-weight: 600; cursor: pointer; }
    button:focus-visible { outline: 3px solid #a8e6c3; outline-offset: 2px; }
    button.stop { background: #37413b; }
    .status { max-width: min(90%, 520px); padding: 8px 12px; border-radius: 5px; background: rgba(16,21,18,.85); font-size: 13px; text-align: center; }
    .hidden { display: none; }
    @media (max-width: 600px) { .label { top: 8px; padding: 5px 7px; font-size: 11px; } .controls { bottom: 8px; flex-direction: column; gap: 6px; } button { padding: 8px 12px; } }
  </style>
</head>
<body>
  <div class="camera-shell">
    <video id="camera" autoplay playsinline muted></video>
    <img id="stopped-frame" class="stopped-frame hidden" alt="Last camera frame; camera is stopped" />
    <div class="divider" aria-hidden="true"></div>
    <div class="label left">PLAYER 1 · LEFT</div>
    <div class="label right">PLAYER 2 · RIGHT</div>
    <div class="controls">
      <button id="start">Start live camera</button>
      <button id="stop" class="stop hidden">Stop camera</button>
      <div id="status" class="status" role="status">Start the camera and allow browser access.</div>
    </div>
  </div>
  <canvas id="capture" class="hidden"></canvas>
  <script>
    const video = document.getElementById("camera");
    const stoppedFrame = document.getElementById("stopped-frame");
    const canvas = document.getElementById("capture");
    const statusBox = document.getElementById("status");
    const startButton = document.getElementById("start");
    const stopButton = document.getElementById("stop");
    let stream = null;
    let liveEnabled = false;
    let sampleTimer = null;
    let awaitingRender = false;
    let awaitingCaptureId = null;

    function send(type, fields = {}) {
      window.parent.postMessage({ isStreamlitMessage: true, type, ...fields }, "*");
    }
    function resizeFrame() {
      const width = Math.max(280, document.documentElement.clientWidth || 640);
      send("streamlit:setFrameHeight", { height: Math.round(width * 9 / 16) + 2 });
    }
    function captureFrame() {
      if (!stream || awaitingRender || video.readyState < HTMLMediaElement.HAVE_CURRENT_DATA) return false;
      const sourceWidth = video.videoWidth;
      const sourceHeight = video.videoHeight;
      if (!sourceWidth || !sourceHeight) return false;
      // Keep the browser frame at camera resolution: shrinking to 640x360 made
      // the original checkpoint miss the second player's smaller hand.
      const scale = Math.min(1, 1280 / sourceWidth, 720 / sourceHeight);
      canvas.width = Math.round(sourceWidth * scale);
      canvas.height = Math.round(sourceHeight * scale);
      const context = canvas.getContext("2d", { alpha: false });
      context.translate(canvas.width, 0);
      context.scale(-1, 1);
      context.drawImage(video, 0, 0, canvas.width, canvas.height);
      context.setTransform(1, 0, 0, 1, 0, 0);
      awaitingCaptureId = window.crypto.randomUUID();
      send("streamlit:setComponentValue", {
        value: {
          capture_id: awaitingCaptureId,
          image: canvas.toDataURL("image/jpeg", 0.9)
        },
        dataType: "json"
      });
      awaitingRender = true;
      statusBox.textContent = liveEnabled ? "Live preview · checking gestures…" : "Live preview · start the game to detect gestures.";
      return true;
    }
    function stopSampling() {
      if (sampleTimer !== null) window.clearTimeout(sampleTimer);
      sampleTimer = null;
    }
    function startSampling() {
      stopSampling();
      if (!stream || !liveEnabled) return;
      // Start with one frame; after that, wait for inference acknowledgement.
      if (!captureFrame()) sampleTimer = window.setTimeout(startSampling, 300);
    }
    function stopCamera() {
      if (stream && video.videoWidth && video.videoHeight) {
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        const context = canvas.getContext("2d", { alpha: false });
        context.translate(canvas.width, 0);
        context.scale(-1, 1);
        context.drawImage(video, 0, 0);
        context.setTransform(1, 0, 0, 1, 0, 0);
        stoppedFrame.src = canvas.toDataURL("image/jpeg", 0.8);
        stoppedFrame.classList.remove("hidden");
      }
      if (stream) stream.getTracks().forEach(track => track.stop());
      stopSampling();
      stream = null;
      video.srcObject = null;
      startButton.classList.remove("hidden");
      stopButton.classList.add("hidden");
      statusBox.textContent = "Camera stopped.";
    }
    async function startCamera() {
      startButton.disabled = true;
      statusBox.textContent = "Waiting for camera permission…";
      try {
        stream = await navigator.mediaDevices.getUserMedia({
          video: { width: { ideal: 1280 }, height: { ideal: 720 }, facingMode: "user" },
          audio: false
        });
        stoppedFrame.classList.add("hidden");
        video.srcObject = stream;
        await video.play();
        startButton.classList.add("hidden");
        stopButton.classList.remove("hidden");
        statusBox.textContent = liveEnabled ? "Live preview · automatic detection is running." : "Live preview · start the game to detect gestures.";
        startSampling();
      } catch (error) {
        const reason = error && error.name === "NotAllowedError"
          ? "Camera access was blocked. Allow it in your browser's site permissions and reload."
          : "Could not start the camera. Check that a camera is connected and not in use by another app.";
        statusBox.textContent = reason;
      } finally {
        startButton.disabled = false;
      }
    }
    startButton.addEventListener("click", startCamera);
    stopButton.addEventListener("click", stopCamera);
    window.addEventListener("resize", resizeFrame);
    window.addEventListener("message", event => {
      if (!event.data || event.data.type !== "streamlit:render") return;
      const args = event.data.args || {};
      const nextEnabled = Boolean(args.live_enabled);
      window.__rpsIntervalMs = args.interval_ms;
      // The app echoes the processed capture ID after its inference rerun.
      if (awaitingCaptureId && args.processed_capture_id === awaitingCaptureId) {
        awaitingCaptureId = null;
        awaitingRender = false;
        stopSampling();
        if (liveEnabled && stream) {
          const interval = Number(args.interval_ms) || Number(window.__rpsIntervalMs) || 1100;
          sampleTimer = window.setTimeout(() => {
            sampleTimer = null;
            if (!captureFrame()) startSampling();
          }, interval);
        }
      }
      if (nextEnabled !== liveEnabled) {
        liveEnabled = nextEnabled;
        if (liveEnabled) startSampling();
        else {
          stopSampling();
          awaitingCaptureId = null;
          awaitingRender = false;
        }
        if (stream) statusBox.textContent = liveEnabled ? "Live preview · automatic detection is running." : "Live preview · start the game to detect gestures.";
      }
      resizeFrame();
    });
    send("streamlit:componentReady", { apiVersion: 1 });
    resizeFrame();
  </script>
</body>
</html>
