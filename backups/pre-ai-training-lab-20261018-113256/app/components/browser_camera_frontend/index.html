<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    * { box-sizing: border-box; }
    html, body { width: 100%; margin: 0; background: #101512; color: #f7faf7; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .camera-shell { width: 100%; position: relative; overflow: hidden; background: #101512; }
    video { display: block; width: 100%; height: auto; aspect-ratio: 16 / 9; object-fit: contain; background: #101512; }
    .divider { position: absolute; top: 0; bottom: 0; left: 50%; width: 3px; transform: translateX(-50%); background: #55c58a; pointer-events: none; }
    .label { position: absolute; top: 14px; padding: 7px 11px; border-radius: 5px; background: rgba(16, 21, 18, .82); color: #fff; font-size: 14px; font-weight: 700; letter-spacing: .04em; pointer-events: none; }
    .left { left: 14px; } .right { right: 14px; }
    .controls { position: absolute; left: 50%; bottom: 14px; transform: translateX(-50%); display: flex; gap: 10px; align-items: center; }
    button { border: 0; border-radius: 6px; padding: 10px 16px; background: #246448; color: white; font-size: 15px; font-weight: 600; cursor: pointer; }
    button:focus-visible { outline: 3px solid #a8e6c3; outline-offset: 2px; }
    button.stop { background: #37413b; }
    .status { max-width: min(90%, 520px); padding: 8px 12px; border-radius: 5px; background: rgba(16,21,18,.85); font-size: 13px; text-align: center; }
    .hidden { display: none; }
    @media (max-width: 600px) { .label { top: 8px; padding: 5px 7px; font-size: 11px; } .controls { bottom: 8px; flex-direction: column; gap: 6px; } button { padding: 8px 12px; } }
  </style>
</head>
<body>
  <div class="camera-shell">
    <video id="camera" autoplay playsinline muted></video>
    <div class="divider" aria-hidden="true"></div>
    <div class="label left">PLAYER 1 · LEFT</div>
    <div class="label right">PLAYER 2 · RIGHT</div>
    <div class="controls">
      <button id="start">Start live camera</button>
      <button id="stop" class="stop hidden">Stop camera</button>
      <div id="status" class="status" role="status">Start the camera and allow browser access.</div>
    </div>
  </div>
  <canvas id="capture" class="hidden"></canvas>
  <script>
    const video = document.getElementById("camera");
    const canvas = document.getElementById("capture");
    const statusBox = document.getElementById("status");
    const startButton = document.getElementById("start");
    const stopButton = document.getElementById("stop");
    let stream = null;
    let timer = null;
    let fps = 2.5;

    function send(type, fields = {}) {
      window.parent.postMessage({ isStreamlitMessage: true, type, ...fields }, "*");
    }
    function resizeFrame() {
      const width = Math.max(280, document.documentElement.clientWidth || 640);
      send("streamlit:setFrameHeight", { height: Math.round(width * 9 / 16) + 2 });
    }
    function captureFrame() {
      if (!stream || video.readyState < HTMLMediaElement.HAVE_CURRENT_DATA) return;
      const sourceWidth = video.videoWidth;
      const sourceHeight = video.videoHeight;
      if (!sourceWidth || !sourceHeight) return;
      const scale = Math.min(1, 640 / sourceWidth, 360 / sourceHeight);
      canvas.width = Math.round(sourceWidth * scale);
      canvas.height = Math.round(sourceHeight * scale);
      const context = canvas.getContext("2d", { alpha: false });
      context.drawImage(video, 0, 0, canvas.width, canvas.height);
      send("streamlit:setComponentValue", {
        value: canvas.toDataURL("image/jpeg", 0.68),
        dataType: "string"
      });
    }
    function stopCamera() {
      if (timer) window.clearInterval(timer);
      timer = null;
      if (stream) stream.getTracks().forEach(track => track.stop());
      stream = null;
      video.srcObject = null;
      startButton.classList.remove("hidden");
      stopButton.classList.add("hidden");
      statusBox.textContent = "Camera stopped.";
    }
    async function startCamera() {
      startButton.disabled = true;
      statusBox.textContent = "Waiting for camera permission…";
      try {
        stream = await navigator.mediaDevices.getUserMedia({
          video: { width: { ideal: 1280 }, height: { ideal: 720 }, facingMode: "user" },
          audio: false
        });
        video.srcObject = stream;
        await video.play();
        startButton.classList.add("hidden");
        stopButton.classList.remove("hidden");
        statusBox.textContent = "Live · one hand on each side · show gestures together.";
        timer = window.setInterval(captureFrame, Math.max(250, 1000 / fps));
        captureFrame();
      } catch (error) {
        const reason = error && error.name === "NotAllowedError"
          ? "Camera access was blocked. Allow it in your browser's site permissions and reload."
          : "Could not start the camera. Check that a camera is connected and not in use by another app.";
        statusBox.textContent = reason;
      } finally {
        startButton.disabled = false;
      }
    }
    startButton.addEventListener("click", startCamera);
    stopButton.addEventListener("click", stopCamera);
    window.addEventListener("resize", resizeFrame);
    window.addEventListener("message", event => {
      if (!event.data || event.data.type !== "streamlit:render") return;
      const requestedFps = Number(event.data.args && event.data.args.target_fps);
      if (Number.isFinite(requestedFps)) fps = Math.max(1, Math.min(4, requestedFps));
      resizeFrame();
    });
    send("streamlit:componentReady", { apiVersion: 1 });
    resizeFrame();
  </script>
</body>
</html>
